<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BELS submission received</title>
    <link rel="icon" href="{{ url_for('static', filename='bels.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='bels.css') }}">
</head>
<body>
<main class="container">
    <header class="page-header">
        <p class="eyebrow">Biodiversity Enhanced Location Services (BELS)</p>
        <h1>Submission received</h1>
    </header>

    <section class="confirmation" role="status">
        <p>Your file has been accepted for processing.</p>
        <p>
            A download link will be sent to <strong>{{ email }}</strong> when the results are ready.
        </p>
        <p>Output file name: <strong>{{ filename }}</strong></p>
        <p>You may close this page while the job is processed.</p>
        <p><a class="secondary-button" href="/">Submit another file</a></p>
    </section>
</main>
</body>
</html>
